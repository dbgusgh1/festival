<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우리 반 게임 페스티벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: Jua, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; color: #2b2118; background: #ffe9a8; overscroll-behavior: none; }
body { background: linear-gradient(#8fdcff, #ffe9a8); }
#app { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.hidden { display: none !important; }
.card { background: #fff; border: 4px solid #2b2118; border-radius: 28px; padding: 24px 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 8px 0 #2b2118; }
.big { font-size: 30px; line-height: 1.25; }
.sub { font-size: 18px; color: #6b5a45; }
.err { color: #d62839; font-size: 15px; min-height: 18px; }
.hint { color: #6b5a45; font-size: 15px; }
input[type=text], input[type=password], input[type=number], textarea, select { font: inherit; font-size: 20px; padding: 12px 14px; border: 3px solid #2b2118; border-radius: 16px; width: 100%; background: #fffdf5; }
.b { font: inherit; font-size: 20px; padding: 12px 16px; border: 3px solid #2b2118; border-radius: 16px; background: #fff; color: #2b2118; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 0 #2b2118; }
.b:active { transform: translateY(3px); box-shadow: 0 1px 0 #2b2118; }
.b.pri { background: #ff5a5f; color: #fff; } .b.warn { background: #ffd400; } .b.sm { font-size: 14px; padding: 6px 10px; box-shadow: none; border-width: 2px; }
.b.link { border: none; box-shadow: none; background: none; font-size: 16px; color: #3d6fd6; }
.parade { width: 100%; }
#demo { position: fixed; left: 0; right: 0; bottom: 0; background: #2b2118; color: #ffd400; font-size: 13px; text-align: center; padding: 3px; z-index: 50; pointer-events: none; }

/* 교실 화면 */
body.host { background: #111; overflow: hidden; }
body.host #app { padding: 0; height: 100%; }
#cv { display: block; }
#qr { position: fixed; z-index: 5; transform-origin: top left; width: 360px; background: #fff; border: 6px solid #2b2118; border-radius: 28px; padding: 18px; text-align: center; }
.qrimg { width: 300px; min-height: 300px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.qrimg img, .qrimg canvas { width: 300px; height: 300px; }
.qrcode { font-size: 86px; letter-spacing: 8px; line-height: 1.1; color: #ff5a5f; }
.qrurl { font-size: 17px; word-break: break-all; color: #6b5a45; }
#gear { position: fixed; right: 10px; bottom: 10px; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 14px; border: 2px solid #fff; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; z-index: 20; }
#drawer { position: fixed; right: 10px; bottom: 56px; width: 460px; max-height: 84vh; overflow: auto; background: #fff; border: 4px solid #2b2118; border-radius: 22px; padding: 14px; z-index: 19; }

/* 조종판 */
body.ctl #app { justify-content: flex-start; max-width: 620px; margin: 0 auto; }
.ctlbox { width: 100%; }
.cstat { background: #2b2118; color: #fff; border-radius: 14px; padding: 10px 12px; font-size: 17px; margin-bottom: 10px; }
.cblk { width: 100%; background: #fff; border: 3px solid #2b2118; border-radius: 18px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
#drawer .cblk { border-width: 2px; }
.cblk h3 { margin: 0; font-weight: 400; font-size: 18px; color: #ff5a5f; }
.row { display: flex; gap: 8px; align-items: center; } .row.wrap { flex-wrap: wrap; }
.row .b { font-size: 16px; padding: 9px 12px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.opt span { white-space: nowrap; } .opt select, .opt input[type=text], .num { font-size: 15px; padding: 6px 8px; border-width: 2px; border-radius: 10px; }
.opt input[type=checkbox] { width: 22px; height: 22px; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dest { font: inherit; text-align: left; border: 2px solid #2b2118; border-radius: 12px; padding: 8px; background: #fff7d6; cursor: pointer; display: flex; flex-direction: column; }
.dest b { font-weight: 400; font-size: 16px; } .dest span { font-size: 12px; color: #6b5a45; }
.dest.off { background: #eee; color: #999; cursor: default; }
.plist, .qlist { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow: auto; }
.prow { display: flex; gap: 6px; align-items: center; font-size: 15px; }
.pn { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.tm { font: inherit; font-size: 13px; border: 2px solid #2b2118; border-radius: 10px; padding: 4px 8px; color: #fff; background: #999; cursor: pointer; }

/* 학생 폰 */
body.phone { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; position: fixed; inset: 0; }
body.phone #app { padding: 0; height: 100%; justify-content: flex-start; align-items: stretch; }
body.phone #app > .card, body.phone #app > .stage { margin: auto; }
body.phone #app > .card { width: calc(100% - 32px); }
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; text-align: center; width: 100%; }
.cookie { width: min(86vw, 52vh); height: min(86vw, 52vh); touch-action: none; cursor: pointer; }
.reveal { width: min(70vw, 40vh); height: min(70vw, 40vh); }
.slip { background: #fff; border: 3px dashed #ff5a5f; border-radius: 12px; padding: 10px 14px; font-size: 18px; }
#ptop { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #2b2118; color: #fff; font-size: 18px; }
#ptop b { font-weight: 400; } #ptop span { color: #ffd400; } #pplace { margin-left: auto; font-size: 15px; }
#pmid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#pv { flex: 1; min-height: 0; width: 100%; display: block; }
#pmsg { padding: 10px 12px; text-align: center; background: #fff; border-top: 4px solid #2b2118; min-height: 84px; display: flex; flex-direction: column; justify-content: center; }
#pmsg.slim { min-height: 0; padding: 6px 10px; } #pmsg.slim .sub { font-size: 16px; }
#pmsg.blue { background: #3d8bff; } #pmsg.red { background: #ff5a5f; } #pmsg.green { background: #27b56a; } #pmsg.warn { background: #ffd400; }
#pmsg.blue *, #pmsg.red *, #pmsg.green * { color: #fff; }
#pjoy { height: 34vh; background: repeating-linear-gradient(45deg, #ffe9a8, #ffe9a8 16px, #ffdf85 16px, #ffdf85 32px); border-top: 4px solid #2b2118; position: relative; touch-action: none; }
.jhint { position: absolute; left: 0; right: 0; top: 8px; text-align: center; color: #a8842a; font-size: 16px; pointer-events: none; }
#pbase { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; background: rgba(43,33,24,.18); border: 4px solid rgba(43,33,24,.5); pointer-events: none; }
#pbase.on { background: rgba(43,33,24,.28); }
#pknob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: #ff5a5f; border: 4px solid #2b2118; }
#ptoast { position: fixed; left: 12px; right: 12px; top: 56px; background: #2b2118; color: #fff; border-radius: 16px; padding: 12px; text-align: center; font-size: 20px; transform: translateY(-400%); opacity: 0; transition: transform .2s, opacity .2s; pointer-events: none; z-index: 5; }
#ptoast.on { transform: none; opacity: 1; }
#pover { position: fixed; inset: 0; background: linear-gradient(#8fdcff, #ffe9a8); z-index: 10; display: flex; align-items: center; justify-content: center; overflow: auto; }
.letter { background: #fffdf5; border: 4px solid #2b2118; border-radius: 22px; margin: 16px; padding: 22px 18px; box-shadow: 0 8px 0 #2b2118; font-size: 20px; line-height: 1.5; }
.letter .lt { font-size: 24px; color: #ff5a5f; margin-bottom: 8px; } .letter p { margin: 6px 0; } .letter .tl { color: #3d6fd6; }
.mission { margin-top: 12px; padding: 10px; background: #ffe9a8; border-radius: 12px; font-size: 16px; }

/* 터치·퀴즈·그림 게임 입력 화면 */
#pask { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 12px; padding: 14px; position: relative; overflow: hidden; touch-action: none; }
#pask.tap { color: #fff; justify-content: center; align-items: center; text-align: center; cursor: pointer; }
.tlab { font-size: 34px; } .thint { font-size: 18px; color: #9a9aa8; padding: 0 20px; }
.ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 4px solid #fff; animation: rip .5s ease-out forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(12); opacity: 0; } }
.alab { font-size: 24px; text-align: center; line-height: 1.3; }
.achoice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .achoice.four { grid-template-columns: 1fr 1fr; }
.ach { font: inherit; font-size: 22px; color: #fff; border: 4px solid #2b2118; border-radius: 20px; min-height: 110px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; box-shadow: 0 5px 0 #2b2118; }
.ach b { font-weight: 400; font-size: 26px; } .ach.on { outline: 6px solid #2b2118; outline-offset: 2px; transform: scale(1.03); }
.ach:disabled { opacity: .55; } .ach.on:disabled { opacity: 1; }
.agrid { display: grid; gap: 8px; } .agrid .ach { background: #fff7d6; color: #2b2118; min-height: 70px; } .agrid .ach.on { background: #ff5a5f; color: #fff; }
.acv { width: min(60vw, 30vh); height: min(60vw, 30vh); align-self: center; }
.dwrap { position: absolute; inset: 0; }
.dcv { width: 100%; height: 100%; display: block; touch-action: none; }
.dmm { position: absolute; right: 8px; top: 8px; width: 112px; height: 63px; border: 3px solid #fff; border-radius: 8px; background: #000; pointer-events: none; }
.dbar { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.92); border-radius: 14px; padding: 4px 6px; }
.dbar .b { font-size: 24px; min-width: 48px; padding: 2px 10px; } .dzl { min-width: 54px; text-align: center; font-size: 18px; }
.dlock { position: absolute; inset: 0; background: rgba(43,33,24,.85); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.dlock .sub { color: #ddd; } .dlt { font-size: 60px; color: #ffd400; }
.secret { display: flex; flex-direction: column; gap: 6px; }
.secret select { font-size: 13px; padding: 4px; border-width: 2px; width: auto; }
.tbody { display: flex; flex-direction: column; gap: 8px; }
.qform { display: flex; flex-direction: column; gap: 6px; }
.pview { width: 100%; border: 3px solid #2b2118; border-radius: 12px; cursor: crosshair; }
.pwork { display: flex; flex-direction: column; gap: 8px; }

/* 두더지 구멍 판 (중·상) */
#pask.holes { background: linear-gradient(#8fd46a, #6dbb4c); justify-content: flex-start; }
.hgrid { flex: 1; display: grid; gap: 10px; align-content: center; }
.hole { font: inherit; position: relative; aspect-ratio: 1.25; border: 0; background: radial-gradient(ellipse 50% 32% at 50% 62%, #3a2010 0 92%, transparent 95%), radial-gradient(ellipse 58% 40% at 50% 64%, #a5672f 0 92%, transparent 95%); cursor: pointer; touch-action: none; }
.hole b { position: absolute; left: 6px; top: 4px; font-weight: 400; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #2b2118, 0 0 4px #2b2118; }
.hole i { position: absolute; left: 50%; top: 10%; width: 46%; height: 50%; margin-left: -23%; background: no-repeat center/contain; opacity: 0; }
.hole.bonk i { animation: bonk .35s ease-out; }
.hole.bonk::after { content: '🔨'; position: absolute; left: 50%; top: 18%; font-size: 40px; transform-origin: 80% 80%; animation: hammer .3s ease-out forwards; }
@keyframes hammer { from { transform: translateX(-30%) rotate(-50deg); opacity: 1; } 60% { transform: translateX(-30%) rotate(15deg); opacity: 1; } to { transform: translateX(-30%) rotate(0); opacity: 0; } }
/* 난이도 표시 */
.lvb { font-size: 13px; padding: 2px 8px; border-radius: 10px; color: #fff; margin-left: 4px; }
.lvrow { display: flex; gap: 6px; align-items: center; font-size: 16px; }
.lvbtn { font: inherit; flex: 1; font-size: 16px; padding: 8px 4px; border: 3px solid #2b2118; border-radius: 12px; background: #fff; cursor: pointer; }
.lvbtn.on { color: #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.lvbtn.lv1.on { background: #27b56a; } .lvbtn.lv2.on { background: #f5a301; } .lvbtn.lv3.on { background: #e63946; }

/* 체육 OX 서바이벌 3D */
#ox3box { position: fixed; z-index: 0; pointer-events: none; }
#ox3box #ox3d, #pmid #ox3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.host #cv { position: relative; z-index: 1; }
/* 체육 OX 서바이벌 — 폰 화면 (원본 index.html의 모양을 그대로) */
body.ox3 #pmid { position: relative; }
body.ox3 #pv, body.ox3 #pmsg { display: none; }
body.ox3.oxres #pmsg { display: flex; position: relative; z-index: 8; }
body.ox3 #pjoy { position: fixed; left: 0; bottom: 0; width: 62vw; height: 42vh; background: none; border: 0; z-index: 6; }
body.ox3 #pjoy .jhint { display: none; }
body.ox3 #pbase { left: 87px; top: calc(100% - 93px); background: rgba(255,255,255,.35); border: 3px solid rgba(255,255,255,.8); }
body.ox3 #pknob { width: 58px; height: 58px; margin: -29px 0 0 -29px; background: #fff; border: 4px solid #1d2433; box-shadow: 0 3px 0 #1d2433; }
#oxui { --ink:#1d2433; --yellow:#ffd23f; --green:#2fbf71; --red:#ef4b4b; position: absolute; inset: 0; pointer-events: none; font-family: "Noto Sans KR", Jua, sans-serif; color: var(--ink); z-index: 7; }
#oxui > * { pointer-events: auto; }
#oxui .hidden { display: none !important; }
#oxui #topbar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
#oxui #topbar > * { pointer-events: auto; } #oxui #topbar .sp { flex: 1; }
#oxui .chip { background: rgba(20,26,40,.82); color: #fff; border-radius: 999px; padding: 6px 10px; font-weight: 700; font-size: 12px; border: none; font-family: inherit; white-space: nowrap; }
#oxui #qbar { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
#oxui #qnum { background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; font-weight: 900; padding: 2px 8px; font-size: 13px; white-space: nowrap; }
#oxui #qtext { flex: 1; font-weight: 700; font-size: 15px; line-height: 1.35; }
#oxui #qtimer { min-width: 40px; height: 40px; border-radius: 10px; background: var(--green); color: #fff; font-family: Jua; font-size: 22px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); }
#oxui #qtimer.warn { background: var(--red); }
#oxui #qhint { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; background: rgba(255,255,255,.85); border-radius: 999px; padding: 3px 10px; white-space: nowrap; pointer-events: none; }
#oxui #oxshirt { position: absolute; top: 142px; left: 50%; transform: translateX(-50%); background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; text-align: center; font-size: 13px; }
#oxui .swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
#oxui .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #cfd4e2; }
#oxui .swatches button.on { box-shadow: 0 0 0 3px var(--ink); }
#oxui #ox3msg { position: absolute; top: 45%; left: 10%; right: 10%; text-align: center; background: rgba(255,255,255,.9); border-radius: 14px; padding: 12px; font-size: 15px; }
#oxui #emojiBtn { position: absolute; right: 18px; bottom: 28px; width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 34px; z-index: 7; }
#oxui #emojiPal { position: absolute; right: 12px; bottom: 112px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px; display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; z-index: 7; }
#oxui #emojiPal button { font-size: 26px; height: 48px; border-radius: 12px; border: 2px solid #e3e6ee; background: #f7f8fb; }
#oxui #reviveBtn { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 7; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 14px; padding: 12px 18px; font-weight: 900; font-size: 16px; font-family: inherit; white-space: nowrap; }
#oxui #cheerTag { position: absolute; left: 50%; bottom: 214px; transform: translateX(-50%); background: rgba(20,26,40,.85); color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; white-space: nowrap; pointer-events: none; }
#oxui #oxtoast { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(.9); background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 14px 20px; text-align: center; font-weight: 900; font-size: 20px; opacity: 0; transition: all .25s; pointer-events: none; max-width: 88%; z-index: 9; }
#oxui #oxtoast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
#oxui #oxtoast small { display: block; font-weight: 500; font-size: 14px; margin-top: 6px; }
#oxui .overlay { position: fixed; inset: 0; background: rgba(15,20,35,.55); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 14px; }
#oxui .modal { background: #f6f7fb; border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
#oxui .mhead { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 900; } #oxui .mhead .sp { flex: 1; }
#oxui .mbody { padding: 14px 16px; overflow: auto; }
#oxui .big { font-family: Jua; font-size: 30px; }
#oxui .muted { color: #667; font-size: 13px; }
#oxui .btn { border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 900; font-size: 15px; background: #fff; box-shadow: 0 3px 0 var(--ink); font-family: inherit; } #oxui .btn.y { background: var(--yellow); }
#oxui .oxbtns { display: flex; gap: 12px; margin-top: 14px; }
#oxui .oxbtns button { flex: 1; font-size: 42px; padding: 16px 0; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); font-family: Jua; }

/* 전광판 + 노트북 조종판 */
#ctlhelp { position: fixed; right: 14px; top: 14px; width: 340px; background: #fff; border: 4px solid #2b2118; border-radius: 20px; padding: 12px; z-index: 21; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
#ctlhelp b { font-weight: 400; color: #e63946; font-size: 17px; }
.cset { width: 100%; background: #fff; border: 2px dashed #b9b2a6; border-radius: 16px; padding: 10px 12px; margin: 6px 0 14px; }
.cset summary { cursor: pointer; color: #7a6f60; font-size: 15px; }
.cset[open] { display: flex; flex-direction: column; gap: 8px; }
.ctlqr { align-self: center; background: #fff; padding: 8px; }
.ctlqr img, .ctlqr canvas { display: block; }
.b.big { font-size: 22px; padding: 14px 18px; }

</style>
</head>

/* ── js/net.js ── */
/* 통신 계층. Firebase 설정이 있으면 Firebase Realtime Database, 없으면 연습 모드(같은 컴퓨터의 창끼리)로 동작한다.
   화면 코드는 set / on / get 세 가지만 쓴다. */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  [].concat(kids || []).forEach(c => c != null && e.append(c));

  /* ───────── 13. 땅따먹기 (큰 맵) ─────────

    for (let k = 0; k < nRock; k++) {

  class Terr {

      const bd = boardFor(pub, st, Object.keys(chars).length), bk = bd.join('|');

      clouds.forEach(c => { c.position.x += dt * 0.8; if (c.position.x > 85) c.position.x = -85; });

  };

    setup(ctx) { return { qs: ctx.pool('tq', ctx.practice ? 1 : (ctx.opts.n || 5)), i: -1, tot: {} }; },
    begin(ctx, g) { this.q(ctx, g); },
    q(ctx, g) {
      g.i++; if (g.i >= g.qs.length) return ctx.done();
      const q = g.qs[g.i]; g.ans = (q.a === 0 || q.a > 0) ? +q.a : null; g.votes = {}; g.open = false;
      ctx.setPub({ ph: g.ans == null ? 'teacher' : 'play', tqz: { q: q.q, o: q.o, n: g.i + 1, total: g.qs.length }, dist: null, ans: null, can: null });
      ctx.priv({ need: g.ans == null ? 'tans' : null, q: q.q, o: q.o });

    open(ctx, g) {

    close(ctx, g) { if (!g.open) return; g.open = false; ctx.askClose(); ctx.setPub({ ph: 'closed', can: 'reveal', canLabel: '선생님 답 공개' }); },
    reveal(ctx, g) {
      const q = g.qs[g.i], dist = q.o.map(() => 0);
      for (const id in g.votes) dist[g.votes[id]]++;
      ctx.active().forEach(id => { const hit = g.votes[id] === g.ans; if (hit) { ctx.score(id, 10); g.tot[id] = (g.tot[id] || 0) + 10; } ctx.tell(id, g.votes[id] == null ? { k: 'msg', b: '고르지 않았어요', s: '', c: '' } : hit ? { k: 'msg', b: '선생님 마음을 읽었어요!', s: ctx.practice ? '연습판' : '+10점', c: 'green' } : { k: 'msg', b: '선생님 답은 ' + q.o[g.ans], s: '0점', c: 'red' }); });
      ctx.setPub({ ph: 'reveal', dist, ans: g.ans, can: 'next', canLabel: g.i + 1 < g.qs.length ? '다음 문제' : '결과 보기' });

    },
    onEv(ctx, g, id, e) { if (e.k === 'ans' && g.open && e.q === ctx.P().ask.key && e.v >= 0 && e.v < 4) g.votes[id] = e.v; },
    bot(ctx, g, id) { if (g.open && g.votes[id] == null && Math.random() < 0.3) ctx.botEv(id, { k: 'ans', v: (Math.random() * 4) | 0 }); },
    end(ctx, g) { return { type: 'solo', title: '선생님 마음 읽기 점수', unit: '점', rows: Sim.rankBy(ctx.active().map(id => ({ id, v: g.tot[id] || 0 })), o => o.v, true) }; },
    draw(c, S) {

      if (!q) { head(c, '퀴즈쇼 스튜디오 · 선생님 퀴즈'); return; }

      if (P.ph === 'teacher') { rr(c, 360, 450, 880, 110, 30, '#ffd400', '#2b2118', 6); txt(c, '선생님이 몰래 답을 고르는 중…', 800, 505, 48, '#2b2118'); }
      else if (P.ph === 'play') timer(c, 1440, 100, Math.max(0, (P.until - Net.now()) / 1000), P.udur || 15);
      choiceTiles(c, q.o, 590, 270, P.dist, P.ph === 'reveal' ? P.ans : null, P.dist ? P.dist.reduce((a, b) => a + b, 0) : 0);

  },

  /* ═════ 05 기억력 구조대 ═════ */

      const corners = [0, cols - 1, N - cols, N - 1], cell = kind === 'what' ? (lv === 3 ? (Math.random() * N) | 0 : corners[(Math.random() * 4) | 0]) : (Math.random() * N) | 0;

      g.cols = cols; g.rows = rows;

      else { ans = cell; q = `${items[cell][1]}(${items[cell][0]})은(는) 어디에 있었나요?`; }

        ctx.setPub({ ph: 'play', memq: { q, until: g.until }, mem: { items: null, r: g.r, R: g.R, cols, rows } });

      ctx.setPub({ ph: 'reveal', mem: { items: g.cur.items, r: g.r, R: g.R, cols: g.cols, rows: g.rows }, memans: { cell: g.cur.kind === 'what' ? g.cur.cell : g.cur.ans, ok, of: ctx.active().length }, can: 'next', canLabel: g.r < g.R ? '다음 문제' : '결과 보기' });
    },
    cmd(ctx, g, m) { if (m.t === 'next' && ctx.P().ph === 'reveal') { this.round(ctx, g); return true; } if (m.t === 'close' && g.open) { this.close(ctx, g); return true; } },

    bot(ctx, g, id) { if (g.open && g.votes[id] == null && Math.random() < 0.3) ctx.botEv(id, { k: 'ans', v: Math.random() < 0.6 ? g.cur.ans : (Math.random() * (g.cur.kind === 'what' ? 4 : g.cols * g.rows)) | 0 }); },
    end(ctx, g) { return { type: 'solo', title: '기억력 점수', unit: '점', rows: Sim.rankBy(ctx.active().map(id => ({ id, v: g.tot[id] || 0 })), o => o.v, true) }; },
    draw(c, S) {

  /* ═════ 07 사진 확대 탐정 ═════ */
  zoom: {

      g.done = {}; g.stage = 0; this.stage(ctx, g);

    stage(ctx, g) {

    onEv(ctx, g, id, e) { if (e.k === 'ans' && g.open && e.q === ctx.P().ask.key && g.sub[id] == null && !g.done[id]) { g.sub[id] = String(e.v || '').slice(0, 30); ctx.tell(id, { k: 'msg', b: '제출했어요', s: '단서가 끝나면 채점해요', c: '' }); } },

  /* ═════ 08 마음속으로 초 세기 — 깜깜한 동굴 ═════
     "준비!!!"(4초) → "시작!!!" 신호부터 마음속으로 센다. 1판 10초 → 2판 13초 → 3판 15초.
     화면에는 시간을 짐작할 수 있는 움직임(캐릭터 줄, 진행 막대)을 두지 않는다. */
  ten: {
    SECS: [10, 13, 15],
    READY: 4000,
    setup(ctx) { return { R: ctx.practice ? 1 : (ctx.opts.n || 3), r: 0, best: {}, recs: {} }; },
    begin(ctx, g) { this.round(ctx, g); },
    round(ctx, g) {
      if (g.r >= g.R) return ctx.done();
      g.r++; g.press = {}; g.t0 = ctx.now() + this.READY; g.open = true;
      g.sec = this.SECS[Math.min(g.r, this.SECS.length) - 1];
      const lv = LVOF(ctx), fl = [];
      if (lv === 3) for (let k = 0; k < 7; k++) { const at = 1300 + Math.random() * (g.sec * 1000 + 500); fl.push(Math.round(at)); ctx.after(this.READY + at, () => { if (g.open) ctx.beep(300 + Math.random() * 700, 0.09, 'triangle'); }); }
      ctx.ask({ type: 'tap', theme: 'ten', label: `🔦 손전등 스위치 · ${g.sec}초`, hint: `"시작!!!"이 나오면 마음속으로 ${g.sec}초를 세고 한 번 탭!`, once: true });
      ctx.setPub({ ph: 'play', ten: { t0: g.t0, r: g.r, R: g.R, sec: g.sec, rows: null, lv, fl }, can: 'close', canLabel: '지금 마감' });
      ctx.after(this.READY, () => ctx.beep(880, 0.35));
      clearTimeout(g.tm); g.tm = ctx.after(this.READY + (g.sec + 10) * 1000, () => this.close(ctx, g));
    },
    close(ctx, g) {
      if (!g.open) return; g.open = false; clearTimeout(g.tm);
      const rows = Sim2.tenGrade(g.t0, g.press, g.sec);
      rows.forEach(r => {
        const prev = g.best[r.id]; if (!prev || r.diff < prev.diff) g.best[r.id] = Object.assign({ sec: g.sec }, r);
        (g.recs[r.id] = g.recs[r.id] || []).push(Sim2.fmt2(r.rec));
        ctx.tell(r.id, { k: 'msg', b: `${Sim2.fmt2(r.rec)}초`, s: `목표 ${g.sec}초와 ${Sim2.fmt2(r.diff)}초 차이 · ${r.rank}등`, c: r.rank === 1 ? 'green' : '' });
      });
      Object.keys(g.press).forEach(id => { if (!rows.find(r => r.id === id)) ctx.tell(id, { k: 'msg', b: '너무 빨랐어요!', s: '"시작!!!" 전에 눌렀어요', c: 'warn' }); });
      ctx.setPub({ ph: 'reveal', ten: { t0: g.t0, r: g.r, R: g.R, sec: g.sec, rows: rows.slice(0, 12).map(r => ({ id: r.id, rec: r.rec, diff: r.diff, rank: r.rank })), n: rows.length }, can: 'next', canLabel: g.r < g.R ? `다음 판 (${this.SECS[Math.min(g.r + 1, this.SECS.length) - 1]}초)` : '결과 보기' });
    },
    cmd(ctx, g, m) { if (m.t === 'close' && g.open) { this.close(ctx, g); return true; } if (m.t === 'next' && ctx.P().ph === 'reveal') { this.round(ctx, g); return true; } },
    onEv(ctx, g, id, e) {

  /* ═════ 12 답이 겹치면 0점 ═════ */
  solo: {
    setup(ctx) { return { qs: ctx.pool('solo', ctx.practice ? 1 : (ctx.opts.n || 10)), i: -1, tot: {} }; },
    begin(ctx, g) { this.q(ctx, g); },
    q(ctx, g) {
      g.i++; if (g.i >= g.qs.length) return ctx.done();
      const T = [0, 30000, 25000, 15000][LVOF(ctx)]; g.ans = {}; g.open = true; g.until = ctx.now() + T; g.S = null;

    },

    confirm(ctx, g) {

      ctx.active().forEach(id => { if (g.ans[id] == null) ctx.tell(id, { k: 'msg', b: '답을 안 냈어요', s: '0점', c: '' }); });

        if (m.t === 'sout') { g.S.toggle(m.k, 'out'); this.priv(ctx, g); return true; }
        if (m.t === 'shide') { g.S.toggle(m.k, 'hide'); this.priv(ctx, g); return true; }
      }

    onEv(ctx, g, id, e) { if (e.k === 'ans' && g.open && e.q === ctx.P().ask.key) { const v = String(e.v || '').trim().slice(0, 20); if (!v) return; const first = g.ans[id] == null; g.ans[id] = v; if (first) ctx.setPub({ sq: Object.assign({}, ctx.P().sq, { cnt: Object.keys(g.ans).length }) }); ctx.tell(id, { k: 'msg', b: '병에 넣어 띄웠어요', s: '마감 전에는 바꿀 수 있어요', c: '' }); } },
    bot(ctx, g, id) { if (g.open && g.ans[id] == null && Math.random() < 0.15) ctx.botEv(id, { k: 'ans', v: ['칠판', '창문', '칠 판', '사물함', '지우개', '책', '공책', '시계', '창문 ', '모니터'][(Math.random() * 10) | 0] }); },
    end(ctx, g) { return { type: 'solo', title: '나만의 답 점수', unit: '점', rows: Sim.rankBy(ctx.active().map(id => ({ id, v: g.tot[id] || 0 })), o => o.v, true) }; },
    draw(c, S) {

      c.fillStyle = '#3aa655'; for (const x of [480, 1120]) { c.fillStyle = '#8a5a2b'; c.fillRect(x - 10, 420, 20, 200); c.fillStyle = '#3aa655'; for (let k = 0; k < 5; k++) { c.beginPath(); c.ellipse(x + Math.cos(k * 1.25) * 60, 420 + Math.sin(k * 1.25) * 24, 70, 18, k * 1.25, 0, 7); c.fill(); } }

  /* ═════ 15 통통! 행운 낙하 ═════ */
  marble: {
    setup(ctx) {
      const ids = ctx.active(), seed = 1 + ((Math.random() * 1e9) | 0);
      const sim = new Sim2.Marble(ids, { seed, dur: ctx.practice ? 60 : 120, lv: LVOF(ctx), spd: 3 });
      ctx.ask({ type: 'info', label: '내 구슬을 응원해요!' });
      const lottery = ctx.opts.mode === 'lottery', K = Math.max(1, Math.min(ids.length, ctx.opts.k || 3));
      ctx.setPub({ mb: { lottery, K, ord: [] } });
      return { sim, lottery, K, cam: 300 };
    },
    begin(ctx, g) { g.sim.start(); ctx.setPub({ ph: 'play' }); },
    tick(ctx, g, dt) {
      if (ctx.P().ph !== 'play') return;
      g.sim.step(dt);
      g.sim.takeEvents().forEach(e => { const win = g.lottery && e.rank <= g.K; ctx.tell(e.id, { k: 'msg', b: win ? `당첨! ${e.rank}번째 골인` : `${e.rank}번째로 골인!`, s: g.lottery ? (win ? '행운의 주인공' : '아쉽지만 다음 기회에') : '', c: (g.lottery ? win : e.rank <= 3) ? 'green' : '' }); ctx.setPub({ mb: { lottery: g.lottery, K: g.K, ord: g.sim.order.slice(0, 10) } }); ctx.beep(e.rank <= 3 ? 990 : 660, 0.06); });
      if (g.sim.ph === 'done' || (g.lottery && g.sim.order.length >= g.K)) ctx.done();
    },
    end(ctx, g) {
      if (g.lottery) return { type: 'lottery', title: `행운 추첨 당첨자 ${g.K}명`, ids: g.sim.order.slice(0, g.K) };
      const rk = g.sim.ranking();
      rk.forEach(r => { if (!r.done) ctx.tell(r.id, { k: 'msg', b: `${r.rank}등`, s: '결승선 가까이까지 왔어요', c: '' }); });
      return { type: 'solo', title: '구슬 경주 도착 순서', unit: '', rows: rk.map(r => ({ id: r.id, rank: r.rank, v: r.done ? '골인' : '도착 못 함' })) };
    },
    draw(c, S, g) {
      if (!g) return;
      const sim = g.sim, C = sim.course, CW = Sim2.Marble.CW, FIN = sim.FIN, CH = sim.CH, t = S.t, players = S.players;
      c.fillStyle = '#eaf6ff'; c.fillRect(0, 0, 1600, 900);
      // 카메라: 아직 달리는 구슬 중 앞쪽 무리를 따라간다
      const run = sim.b.filter(b => !b.fin).sort((a, b) => b.y - a.y), tgt = run.length ? run[Math.min(2, run.length - 1)].y - 380 : FIN - 600;
      g.cam += (Math.max(0, Math.min(FIN - 700, tgt)) - g.cam) * 0.22;
      const sc = 0.9, ox = 330, oy = -g.cam * sc;
      const drawCourse = (s, ox, oy, minimal) => {
        c.save(); c.translate(ox, oy); c.scale(s, s);
        c.fillStyle = '#ffffff'; c.fillRect(0, 0, CW, CH); c.fillStyle = '#d7ecff'; for (let y = 0; y < CH; y += 400) c.fillRect(0, y, CW, 200);
        c.lineCap = 'round'; c.strokeStyle = '#8a5a2b'; c.lineWidth = 14; C.segs.forEach(sg => { c.beginPath(); c.moveTo(sg.x1, sg.y1); c.lineTo(sg.x2, sg.y2); c.stroke(); });
        C.bumps.forEach(o => { c.fillStyle = o.k === 'bumper' ? '#ff4d6d' : '#5e60ce'; c.beginPath(); c.arc(o.x, o.y, o.r, 0, 7); c.fill(); if (!minimal && o.k === 'bumper') { c.fillStyle = '#fff'; c.beginPath(); c.arc(o.x, o.y, o.r * 0.5, 0, 7); c.fill(); } });
        C.mills.forEach(m => { c.strokeStyle = '#2a9d8f'; c.lineWidth = 16; sim.millSegs(m).forEach(sg => { c.beginPath(); c.moveTo(sg.x1, sg.y1); c.lineTo(sg.x2, sg.y2); c.stroke(); }); c.fillStyle = '#264653'; c.beginPath(); c.arc(m.x, m.y, 14, 0, 7); c.fill(); });
        for (let x = 0; x < CW; x += 40) { c.fillStyle = (x / 40) % 2 ? '#222' : '#fff'; c.fillRect(x, FIN, 40, 30); }
        c.lineCap = 'butt'; c.restore();
      };
      // 왼쪽 전체 지도
      const ms = 860 / CH; drawCourse(ms, 40, 20, true);
      sim.b.forEach(b => { const pl = players[b.id]; c.fillStyle = pl ? `hsl(${(pl.c * 47) % 360} 85% 55%)` : '#999'; c.beginPath(); c.arc(40 + b.x * ms, 20 + Math.min(b.y, FIN) * ms, 3, 0, 7); c.fill(); });
      c.strokeStyle = '#e63946'; c.lineWidth = 3; c.strokeRect(40, 20 + g.cam * ms, CW * ms, 900 / sc * ms);
      // 가운데 큰 화면
      c.save(); c.beginPath(); c.rect(ox, 0, CW * sc, 900); c.clip();
      drawCourse(sc, ox, oy, false);
      sim.b.forEach(b => { if (b.fin) return; const pl = players[b.id], x = ox + b.x * sc, y = oy + b.y * sc; if (y < -40 || y > 940) return; const hue = pl ? (pl.c * 47) % 360 : 0; c.fillStyle = `hsl(${hue} 85% 60%)`; c.beginPath(); c.arc(x, y, Sim2.Marble.BR * sc, 0, 7); c.fill(); c.lineWidth = 3; c.strokeStyle = `hsl(${hue} 55% 30%)`; c.stroke(); c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(x - 4, y - 4, 4, 0, 7); c.fill(); if (pl) txt(c, nameOf(pl), x, y - 22, 16, '#222', 'center', '#fff'); });
      c.restore(); c.strokeStyle = '#2b2118'; c.lineWidth = 6; c.strokeRect(ox, 0, CW * sc, 900);
      // 오른쪽 도착 순서
      const P = S.pub, mb = P.mb || {};
      rr(c, 1250, 20, 330, 860, 24, '#fff', '#2b2118', 5);
      txt(c, mb.lottery ? `행운 추첨 · ${mb.K}명` : '도착 순서', 1415, 60, 32, '#e63946');
      (mb.ord || []).forEach((id, k) => { const pl = players[id]; if (!pl) return; const y = 120 + k * 72; drawChar(c, 1300, y, 24, pl.c, { face: 'laugh' }); txt(c, `${k + 1}. ${nameOf(pl)}`, 1340, y, 30, mb.lottery && k < mb.K ? '#e63946' : '#222', 'left'); });
      if (P.ph === 'play') txt(c, Math.ceil(Math.max(0, sim.left)) + '초', 1415, 840, 34, '#888');
    }
  },

  /* ═════ 16 틀린 그림 찾기 ═════ */
  diff: {
    setup(ctx) {
      const mine = ctx.photos('diff'), scenes = shuffle(Object.keys(ART.SCENES)).map(k => ({ scene: k }));
      let list = ctx.opts.src === 'mine' && mine.length ? mine : ctx.opts.src === 'mix' ? shuffle(scenes.concat(mine)) : scenes;
      list = list.slice(0, ctx.practice ? 1 : (ctx.opts.n || 3));
      return { list, i: -1, fixedBy: {}, total: 0, found: 0, a: document.createElement('canvas'), b: document.createElement('canvas') };
    },
    begin(ctx, g) { this.round(ctx, g); },
    async round(ctx, g) {
      g.i++; if (g.i >= g.list.length) return ctx.done();
      const it = g.list[g.i]; [g.a, g.b].forEach(cv => { cv.width = 1600; cv.height = 900; });
      const A = g.a.getContext('2d'), B = g.b.getContext('2d');
      const lv = LVOF(ctx); g.lv = lv;
      if (it.scene) { const d = ART.makeDiffs(it.scene, ctx.practice ? 3 : (ctx.opts.spots || [0, 3, 5, 7][lv]), (Math.random() * 1e9) | 0, lv); ART.renderScene(A, it.scene, d.objs, false); ART.renderScene(B, it.scene, d.objs, true); g.spots = d.spots; g.title = ART.SCENES[it.scene].name; }
      else { const img = await ctx.loadImg(it.id); if (img) ART.cover(A, img); B.drawImage(g.a, 0, 0); ART.mutatePhoto(B, it.spots || []); g.spots = (it.spots || []).map(s => ({ x: s.x, y: s.y, r: s.r })); g.title = it.title || '사진'; }
      g.fixed = g.spots.map(() => null); g.miss = {}; g.lock = {}; g.cand = {}; g.total += g.spots.length;
      const big = document.createElement('canvas'); big.width = 2000; big.height = 1125; big.getContext('2d').drawImage(g.b, 0, 0, 2000, 1125);
      const k = key(); await ctx.setImg({ k, url: big.toDataURL('image/jpeg', 0.78) });
      g.until = ctx.now() + (ctx.opts.dur || 120) * 1000; g.open = true;
      ctx.ask({ type: 'diff', img: k, label: '틀린 곳을 찾아 터치!' });
      ctx.setPub({ ph: 'play', df: { k, title: g.title, i: g.i + 1, n: g.list.length, total: g.spots.length, fixed: [], until: g.until, last: null, rev: null }, can: 'close', canLabel: '이 그림 마치기' });
      clearTimeout(g.tm); g.tm = ctx.after((ctx.opts.dur || 120) * 1000, () => this.close(ctx, g));
    },
    patch(g, s) { const pad = s.r + 6, cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(pad * 2); cv.getContext('2d').drawImage(g.a, s.x - pad, s.y - pad, pad * 2, pad * 2, 0, 0, pad * 2, pad * 2); return cv.toDataURL('image/jpeg', 0.85); },
    award(ctx, g, i) {
      const c = g.cand[i]; delete g.cand[i]; if (!c || !c.length || g.fixed[i]) return;
      c.sort((a, b) => a.at - b.at || a.n - b.n); const w = c[0].id, s = g.spots[i];
      g.fixed[i] = w; g.fixedBy[w] = (g.fixedBy[w] || 0) + 1; g.found++; ctx.score(w, 10); ctx.stat(w, 'fix');
      ctx.tell(w, { k: 'diff', r: 'hit', x: c[0].x, y: c[0].y, b: '찾았어요! 복원 완료', s: ctx.practice ? '연습판' : '+10점', c: 'green' });
      c.slice(1).forEach(o => { if (o.id !== w) ctx.tell(o.id, { k: 'diff', r: 'already', x: o.x, y: o.y, b: '먼저 고쳤어요!', s: ctx.name(w) + '이(가) 먼저', c: 'warn' }); });
      const df = ctx.P().df; df.fixed = df.fixed.concat([{ i, x: s.x, y: s.y, r: s.r, by: ctx.name(w), p: this.patch(g, s) }]); df.last = ctx.name(w);
      ctx.setPub({ df }); ctx.beep(990, 0.1); FX.stars(810 + s.x * 750 / 1600, 230 + s.y * 422 / 900, 8); FX.pop(810 + s.x * 750 / 1600, 250 + s.y * 422 / 900, ctx.name(w), '#e63946', 30);
      if (g.fixed.every(Boolean)) ctx.after(1200, () => this.close(ctx, g));
    },
    close(ctx, g) {

      const df = ctx.P().df; df.rev = g.spots.map((s, i) => (g.fixed[i] ? null : { x: s.x, y: s.y, r: s.r })).filter(Boolean);

}

  // 학생 폰의 입력(터치·답). 지금 받고 있는 질문(ask.key)에 대한 새 입력만 게임에 넘긴다.

      case 'nobots': Object.keys(bots).forEach(id => Net.set(base + '/players/' + id, null)); bots = {}; break;

  const teamOf = id => { const p = S.players[id]; if (p && p.tm != null) return p.tm; const n = Array(nTeams).fill(0); active().forEach(i => { const q = S.players[i]; if (q.tm != null && q.tm < nTeams) n[q.tm]++; }); const tm = n.indexOf(Math.min(...n)); Net.set(base + '/players/' + id + '/tm', tm); if (p) p.tm = tm; return tm; };

  /* ── 여행지로 이동 → 게임 준비 ── */

      function paint() {
        vc.drawImage(cv, 0, 0);
        if (kind === 'diff') { if (preview.checked) ART.mutatePhoto(vc, spots); spots.forEach((s, k) => { vc.strokeStyle = '#ff2d55'; vc.lineWidth = 6; vc.beginPath(); vc.arc(s.x, s.y, s.r, 0, 7); vc.stroke(); txt(vc, String(k + 1), s.x, s.y, 40, '#fff', 'center', '#ff2d55'); }); info.textContent = `틀린 곳 ${spots.length}개 · 사진을 눌러 추가 (3~7개 권장)`; }
        else if (center) { [ws[0].value / 100, ws[1].value / 100, 1].forEach((w, k) => { const vw = 1600 * w, vh = vw * 9 / 16; let sx = Math.max(0, Math.min(1600 - vw, center.x - vw / 2)), sy = Math.max(0, Math.min(900 - vh, center.y - vh / 2)); vc.strokeStyle = ['#ff2d55', '#ffcc00', '#34c759'][k]; vc.lineWidth = 8; vc.strokeRect(sx, sy, vw, vh); }); info.textContent = '빨강 = 첫 단서, 노랑 = 두 번째 단서, 초록 = 마지막(전체)'; }
        else info.textContent = '첫 단서로 보여 줄 부분을 사진에서 눌러요';
      }
      view.addEventListener('click', e => { const r = view.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1600, y = (e.clientY - r.top) / r.height * 900; if (kind === 'diff') { if (spots.length >= 9) return; spots.push({ x: Math.round(x), y: Math.round(y), r: +rIn.value, k: kSel.value }); } else center = { x: Math.round(x), y: Math.round(y) }; paint(); });
      [rIn, preview, ...ws].forEach(i => i.addEventListener('input', paint));
      const save = btn('저장', async () => {
        err.textContent = '';
        if (kind === 'diff' && spots.length < 1) { err.textContent = '틀린 곳을 하나 이상 찍어 주세요.'; return; }
        if (kind === 'zoom' && !center) { err.textContent = '첫 단서 위치를 사진에서 눌러 주세요.'; return; }
        if (kind === 'zoom' && !title.value.trim()) { err.textContent = '정답을 적어 주세요.'; return; }
        const id = 'p' + Date.now().toString(36), url = cv.toDataURL('image/jpeg', 0.8);
        await Net.set(`${T}/img/${id}`, url);
        const meta = kind === 'diff' ? { title: title.value.trim() || '내 사진', spots } : { ans: title.value.trim(), alts: alts.value.split(',').map(s => s.trim()).filter(Boolean), cx: center.x, cy: center.y, w: [ws[0].value / 100, ws[1].value / 100, 1] };
        await Net.set(`${T}/q/${kind}/${id}`, meta); reset();
      }, 'pri');
      work.replaceChildren(view, info, kind === 'diff' ? el('div', { class: 'opts' }, [el('label', { class: 'opt' }, [el('span', { text: '크기' }), rIn]), el('label', { class: 'opt' }, [el('span', { text: '바꾸는 방법' }), kSel]), el('label', { class: 'opt' }, [el('span', { text: '바뀐 모습 미리 보기' }), preview]), btn('마지막 점 지우기', () => { spots.pop(); paint(); }, 'sm')]) : el('div', { class: 'opts' }, [el('label', { class: 'opt' }, [el('span', { text: '첫 단서 폭' }), ws[0]]), el('label', { class: 'opt' }, [el('span', { text: '두 번째 단서 폭' }), ws[1]])]),
        title, kind === 'zoom' ? alts : null, save);
      paint();
    }
    function loadList() {
      Net.get(`${T}/q/${kind}`).then(v => { v = v || {}; const ks = Object.keys(v);
        list.replaceChildren(...(ks.length ? ks.map(k => el('div', { class: 'prow' }, [el('span', { class: 'pn', text: kind === 'diff' ? `${v[k].title} · 틀린 곳 ${(v[k].spots || []).length}개` : `정답 ${v[k].ans}` }), btn('지우기', async () => { await Net.set(`${T}/q/${kind}/${k}`, null); await Net.set(`${T}/img/${k}`, null); loadList(); }, 'sm')])) : [el('div', { class: 'hint', text: '아직 올린 사진이 없어요. 행사 때 "문제 출처: 내 문제"나 "모두 섞어서"를 고르면 나와요.' })])); });
    }
    loadList();
  }

  /* ── 공용 창고 ── */
  function pageShared() {
    const list = el('div', { class: 'qlist' });
    body.replaceChildren(el('div', { class: 'hint', text: '모든 선생님이 함께 쓰는 문제예요. 행사 때 "문제 출처: 공용 창고"를 고르면 나와요. 내가 올린 문제와(관리자는 모든 문제를) 지울 수 있어요.' }), list);
    Net.get('shared').then(v => {
      v = v || {}; const rows = [];
      Object.keys(QTYPES).forEach(type => Object.entries(v[type] || {}).forEach(([k, it]) => rows.push(el('div', { class: 'prow' }, [el('span', { class: 'pn', text: `[${QTYPES[type].name}] ${QTYPES[type].show(it)} · ${it.by || ''}` }), (it.uid === uid || isAdmin) ? btn('지우기', () => Net.set(`shared/${type}/${k}`, null).then(pageShared), 'sm') : null]))));
      list.replaceChildren(...(rows.length ? rows : [el('div', { class: 'hint', text: '아직 공용 창고가 비어 있어요.' })]));
    });
  }

  /* ── 지난 행사 ── */
  function pageHist() {
    Net.get(`${T}/rooms`).then(v => {
      v = v || {}; const ks = Object.keys(v).sort((a, b) => v[b].t - v[a].t).slice(0, 20);
      body.replaceChildren(...(ks.length ? ks.map(k => { const r = v[k], d = new Date(r.t);
        return el('div', { class: 'cblk' }, [el('b', { text: `${d.getMonth() + 1}월 ${d.getDate()}일 · 방 ${k} · ${r.n || 0}명` }),
          ...(r.games || []).map(g => el('div', { class: 'hint', text: `${GAMES[g.gid] ? GAMES[g.gid].icon + ' ' + GAMES[g.gid].name : g.gid}${g.practice ? ' (연습)' : ''} — ${(g.top || []).join(', ')}` })),
          navLink('이 방 다시 열기', '?host=' + k, 'b sm')]); }) : [el('div', { class: 'hint', text: '아직 연 행사가 없어요.' })]));
    });
  }

  /* ── 관리자 ── */
  function pageAdmin() {
    Net.get('users').then(v => {
      v = v || {}; const ks = Object.keys(v).sort((a, b) => (v[b].t || 0) - (v[a].t || 0));
      body.replaceChildren(el('div', { class: 'hint', text: `가입한 선생님 ${ks.length}명 · 공용 창고 정리는 "공용 창고" 탭에서 할 수 있어요.` }),
        ...ks.map(k => el('div', { class: 'prow' }, [el('span', { class: 'pn', text: `${v[k].id} · ${new Date(v[k].t || 0).toLocaleDateString('ko-KR')} 가입` })])));
    });
  }
}

</script>
<script>
/* ── js/main.js ── */
/* 첫 화면과 주소별 화면 나누기
   주소 뒤에 ?r=방번호 → 학생 폰,  ?host=방번호 → 교실 화면,  ?ctl=방번호 → 선생님 조종판 */
window.boot = function () { return bootInner().catch(e => { console.error(e); showErr(e && (e.stack || e.message) || e); }); };
async function bootInner() {
  const app = $('#app');
  app.replaceChildren(el('div', { class: 'card', text: '불러오는 중…' }));
  await Net.ready();
  if (!Net.live && !$('#demo')) document.body.append(el('div', { id: 'demo', text: '연습 모드 · 이 컴퓨터의 브라우저 창끼리만 연결돼요' }));

  function teacherGate(then) {
    if (Net.teacher()) return then();
    let mode = 'login';
    const id = el('input', { type: 'text', placeholder: '아이디 (영문 소문자·숫자 3~20자)', autocapitalize: 'off' }), pw = el('input', { type: 'password', placeholder: '비밀번호 (6자 이상)' }), pw2 = el('input', { type: 'password', placeholder: '비밀번호 한 번 더' });
    const err = el('div', { class: 'err' }), go = el('button', { class: 'b pri' }), sw = el('button', { class: 'b link' }), title = el('div', { class: 'big' });
    [id, pw, pw2].forEach(i => i.addEventListener('input', () => (err.textContent = '')));
    const paint = () => { title.textContent = mode === 'login' ? '선생님 로그인' : '선생님 계정 만들기'; go.textContent = mode === 'login' ? '로그인' : '계정 만들기'; sw.textContent = mode === 'login' ? '처음이에요. 계정 만들기' : '이미 계정이 있어요'; pw2.style.display = mode === 'login' ? 'none' : ''; };
    sw.onclick = () => { mode = mode === 'login' ? 'signup' : 'login'; err.textContent = ''; paint(); };
    go.onclick = async () => {
      const i = id.value.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(i)) { err.textContent = '아이디는 영문 소문자와 숫자로 3~20자예요.'; return; }
      if (pw.value.length < 6) { err.textContent = '비밀번호는 6자 이상이어야 해요.'; return; }
      if (mode === 'signup' && pw.value !== pw2.value) { err.textContent = '비밀번호 두 칸이 서로 달라요.'; return; }
      try { await (mode === 'login' ? Net.login(i, pw.value) : Net.signup(i, pw.value)); if (mode === 'signup') Net.set('users/' + Net.uid(), { id: i, t: Net.now() }); then(); } catch (e) { err.textContent = e.message; }
    };
    paint();
    app.replaceChildren(el('div', { class: 'card' }, [title, id, pw, pw2, err, go, sw, navLink('처음으로', '?')]));
  }

  function dashboard() {
    document.body.className = 'ctl';
    const ed = el('div', { class: 'cblk' }), err = el('div', { class: 'err' });
    const open = async () => {
      for (let k = 0; k < 20; k++) { const code = String(1000 + ((Math.random() * 9000) | 0)); if (!(await Net.get('rooms/' + code + '/meta'))) { go('?host=' + code); return; } }
      err.textContent = '빈 방 번호를 찾지 못했어요. 다시 눌러 주세요.';
    };
    app.replaceChildren(el('h2', { text: `${Net.teacher()} 선생님` }),
      el('div', { class: 'cblk' }, [el('h3', { text: '교실 컴퓨터에서' }), el('div', { class: 'hint', text: '방을 열면 이 창이 교실 화면이 돼요. F11로 전체 화면을 켜 주세요.' }), el('button', { class: 'b pri', text: '새 방 열기', onclick: open }), err]),
      ed, el('button', { class: 'b link', text: '로그아웃', onclick: async () => { await Net.logout(); go('?'); } }));
    teacherBox(ed);
  }

  if (QS.get('r')) return startPlayer(QS.get('r').trim());
  if (QS.get('host')) return teacherGate(() => startHost(QS.get('host')));
  if (QS.get('ctl')) return teacherGate(() => startCtl(QS.get('ctl')));
  if (QS.has('teacher')) return teacherGate(dashboard);

  const code = el('input', { type: 'text', inputmode: 'numeric', maxlength: 4, placeholder: '방 번호 4자리' }), err = el('div', { class: 'err' });
  code.addEventListener('input', () => (err.textContent = ''));
  const cv = el('canvas', { width: 600, height: 200, class: 'parade' });
  app.replaceChildren(el('div', { class: 'card' }, [cv, el('div', { class: 'big', text: '우리 반 게임 페스티벌' }), el('div', { class: 'sub', text: '교실에서 출발해 세계를 여행하고 다시 교실로!' }), code, err,
    el('button', { class: 'b pri', text: '학생 입장', onclick: () => { const v = code.value.trim(); if (!/^\d{4}$/.test(v)) { err.textContent = '교실 화면에 보이는 방 번호 4자리를 넣어 주세요.'; return; } go('?r=' + v); } }),
    navLink('선생님은 여기로', '?teacher'), el('div', { class: 'hint', style: 'opacity:.5;font-size:12px;margin-top:6px', text: APP_VER + (Net.live ? ' · 실제 연결' : ' · 연습 모드') })]));
  const c = cv.getContext('2d'); (function l(ms) { if (!cv.isConnected) return; c.clearRect(0, 0, 600, 200); [7, 23, 41, 12, 58, 94].forEach((s, k) => drawChar(c, 60 + k * 96, 110, 36, s, { face: k % 2 ? 'laugh' : 'smile', hat: ['band', 'explorer', 'city', null, 'night', 'party'][k], bob: -Math.abs(Math.sin(ms / 300 + k)) * 14 })); requestAnimationFrame(l); })(0);
}
window.boot();

</script>
